# Releases cauthy: six binaries, archives, checksums.txt signed with cosign
# (keyless, by the release workflow's GitHub identity). The workflow attests
# build provenance and publishes the npm packages from dist/ afterwards.
version: 2
project_name: cauthy

before:
  hooks:
    - go mod tidy -diff

builds:
  - id: cauthy
    main: ./cmd/cauthy
    binary: cauthy
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/vennet-developers/cauthy-cli/internal/cli.Version={{ .Version }}
      - -X github.com/vennet-developers/cauthy-cli/internal/cli.Commit={{ .FullCommit }}
      - -X github.com/vennet-developers/cauthy-cli/internal/cli.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cauthy
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "cauthy_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc

release:
  github:
    owner: vennet-developers
    name: cauthy-cli
  draft: false
  prerelease: auto
