name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    # The environment requires Ivan's approval before the job starts.
    environment: release
    permissions:
      contents: write     # the GitHub release
      id-token: write     # cosign keyless signing, npm trusted publishing and provenance
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm trusted publishing: npm exchanges this job's OIDC token (id-token:
      # write, environment release) for a one-off publish credential, so no npm
      # token is stored anywhere. Each package names this repository, this
      # workflow and the release environment as its trusted publisher on npm.
      - name: npm with trusted publishing
        run: npm install -g npm@11.19.1
      - name: publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          node npm/scripts/stage.mjs "$version" dist npm/dist
          # The six platform packages first, @cauthyhq/cli (bin: cauthy) last.
          for dir in npm/dist/cli-*; do
            npm publish "$dir" --provenance --access public --tag "$tag"
          done
          npm publish npm/dist/cli --provenance --access public --tag "$tag"
